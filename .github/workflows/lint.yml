name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      # _shared 与 notification 严格检查;平台脚本宽松(历史代码逐步清理)
      - name: Ruff strict on shared infra
        run: ruff check script/_shared notification

      - name: Ruff on platform scripts (non-blocking)
        continue-on-error: true
        run: ruff check script --exclude script/_shared

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt mypy

      - name: mypy strict on shared infra
        run: mypy --strict script/_shared

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
